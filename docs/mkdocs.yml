site_name: cl-date-kit
site_description: Dependency-free, SBCL-only date/time library with IANA time zone support, inspired by java.time, chrono, and Temporal
site_url: https://nerima-lisp.github.io/cl-date-kit/
repo_url: https://github.com/nerima-lisp/cl-date-kit
repo_name: nerima-lisp/cl-date-kit
edit_uri: edit/main/docs/src/

docs_dir: src
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  # pymdownx.snippets is deliberately absent: its only use here was pulling the
  # root CHANGELOG.md into docs/src/changelog.md, and neither file exists any
  # more (2026-08-01 -- the GitHub Release description is the only changelog).

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick start: quick-start.md
  - Guide:
      - Core concepts: core-concepts.md
      - Conditions: conditions.md
  - Reference:
      - API: api-reference.md
      - Compatibility: compatibility.md
  - Internals:
      - Architecture: architecture.md
  - Project:
      - Development: development.md
