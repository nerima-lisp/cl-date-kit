name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flake-check:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run verification suite
        run: nix flake check
